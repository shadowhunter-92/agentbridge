# Local synthetic evaluation. Supply a unique operator secret before startup.
services:
  agentbridge:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - AGENTBRIDGE_ADMIN_KEY=${AGENTBRIDGE_ADMIN_KEY:?set a unique random operator secret}
      - AGENTBRIDGE_DB=/app/data/governance.db
    volumes:
      - agentbridge_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  agentbridge_data:
