name: Trust Evidence end-to-end acceptance
on:
  push:
    branches: [security/ip-product-gates-2026-10]
  pull_request:
    branches: [integration/r4-main-reconciliation-2026-10, main]
permissions:
  contents: read
jobs:
  trust-evidence:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned project test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run full synthetic workflow and negative cases
        run: |
          python -m examples.trust_evidence_end_to_end
          python -m tools.benchmark_trust_evidence --count 12
          python -m pytest tests/test_trust_evidence_end_to_end.py tests/test_evidence_sdk_adversarial_contract.py tests/test_observer_rotation_transitions.py -q
