name: Externally pinned Evidence and bounded HTTPS acceptance
on:
  push:
    branches: [feat/evidence-remote-verifier-oct2026]
  pull_request:
    branches: [security/ip-product-gates-2026-10, integration/r4-main-reconciliation-2026-10]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - name: Offline pinned verifier and bounded HTTPS contract
        run: |
          python -m pytest tests/test_external_evidence_verifier.py tests/test_bounded_https_destination_contract.py tests/test_evidence_sdk_adversarial_contract.py -q
