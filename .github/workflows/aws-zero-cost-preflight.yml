name: AWS $0 staging preflight (offline)
on:
  push:
    branches: [integration/r4-main-reconciliation-2026-10]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  aws-zero-cost-static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check AWS CloudFormation structure offline
        run: |
          python -m pip install "cfn-lint==1.57.2"
          cfn-lint infra/aws/staging-audit-only.template.json
      - name: Validate no deployment identity or write privileges are requested
        run: python tools/validate_aws_zero_cost.py
