name: Build and Push Docker Image

# Dormant by design: runs ONLY on a published GitHub Release or a manual dispatch —
# never on normal pushes — so it can't create a red badge before Docker Hub is set up.
# Requires repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN before it will push.
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE_NAME: shadowhunter/agentbridge

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name || github.sha }}
