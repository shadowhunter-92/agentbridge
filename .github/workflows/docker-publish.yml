name: Build and Push Docker Image

# Dormant by design: runs ONLY on a published GitHub Release or a manual dispatch —
# never on normal pushes — so it can't create a red badge before Docker Hub is set up.
# Requires repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN before it will push.
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE_NAME: shadowhunter/agentbridge

permissions:
  contents: read

jobs:
  docker:
    if: ${{ vars.AGENTBRIDGE_PUBLISH_APPROVED == 'true' }}
    environment: container-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.release
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name || github.sha }}
