name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen.
      placeholder: A clear description of the bug...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a minimal code example or steps to reproduce the issue.
      placeholder: |
        1. Run `python examples/demo_story.py`
        2. Observe the error...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your OS, Python version, and installed packages.
      placeholder: |
        OS: Windows 11 / macOS 14 / Ubuntu 22.04
        Python: 3.12.4
        AgentBridge: 0.1.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Paste any relevant error messages or logs.
      render: shell
